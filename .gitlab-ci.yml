include:
  - project: labs/salt-automation
    file:
      - /gitlab-ci-templates/common/rules.v1.yml
      - /gitlab-ci-templates/common/pre-commit.v1.yml
      - /gitlab-ci-templates/common/conventional-commits-meta.v1.yml
      - /gitlab-ci-templates/common/docker-build-meta.v2.yml
      - /gitlab-ci-templates/common/docker-release-meta.v1.yml
      - /gitlab-ci-templates/common/config-updater-meta.v1.yml

stages:
  - lint
  - build
  - release
  - deploy

variables:
  IMAGE_SHA: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}
  # Docker Hub repository, created by salt-automation:
  # terraform/services/dockerhub/registries/digsuv.yaml
  RELEASE_REGISTRY_IMAGE: magentaaps/msync
  POETRY_VERSION: "2.4.1"
  PRECOMMIT_USE_POETRY: "true"
  # create the poetry venv as .venv in the project directory so basedpyright's
  # venvPath/venv settings in pyproject.toml resolve in CI as well
  POETRY_VIRTUALENVS_IN_PROJECT: "true"


# Conditions
#############

.if-default-branch-refs: &if-default-branch-refs
  if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.if-tag: &if-tag
  if: '$CI_COMMIT_TAG'

.if-merge-request: &if-merge-request
  if: '$CI_MERGE_REQUEST_IID'


# Workflow
##########

workflow:
  rules:
    - <<: *if-tag
    - <<: *if-default-branch-refs
    - <<: *if-merge-request


# Linting
#########

lint:commits:
  extends: .lint:commits

Pre-commit:
  image: python:3.14


# Build
#######

Build:
  extends: .build-docker


# Release
#########

# On master: run semantic-release, which creates a version tag (and GitLab
# release) from the conventional commits. The tag triggers a tag pipeline.
release:semantic-commit:
  extends: .release:semantic-commit

# On master: push the image to magentaaps/msync:master
Release master:
  extends: .release-master
  needs: [Build]

# On an X.Y.Z tag: push the image to magentaaps/msync with the semver tags
# computed by "Generate release tags" (X.Y.Z, X.Y, X, ...)
Release version:
  extends: .release-version
  needs: [Build, Generate release tags]


# Deploy
########

# On an X.Y.Z tag: bump MSYNC_APPLICATION_DOCKER_IMAGE in salt-automation's
# salt/pillar/digsuv/msync/magenta/staging.sls via the config updater.
# Needs the CONFIG_UPDATER_USERNAME and CONFIG_UPDATER_PASSWORD CI/CD variables.
Update staging version:
  extends: .release-to-dev
  needs: [Release version]
  variables:
    ENDPOINT: digsuv/salt/msync-update-staging
