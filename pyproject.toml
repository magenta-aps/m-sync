[tool.poetry]
name = "mSync"
version = "0.0.0"   # version managed through conventional commits
description = ""
authors = [
    "Magenta ApS <info@magenta.dk>"
]
license = "MPL-2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.13.5"
structlog = "^26.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
pytest-asyncio = "^1.4"

[tool.poetry.group.pre-commit.dependencies]
pre-commit = "^4.6"
ruff = "^0.16"
deptry = "^0.25"
basedpyright = "^1.31"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
