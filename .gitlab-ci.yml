include:
  - project: labs/salt-automation
    file:
      - /gitlab-ci-templates/common/rules.v1.yml
      - /gitlab-ci-templates/common/pre-commit.v1.yml
      - /gitlab-ci-templates/common/conventional-commits-meta.v1.yml
      - /gitlab-ci-templates/common/docker-build-meta.v2.yml
      - /gitlab-ci-templates/common/docker-release-meta.v1.yml
      - /gitlab-ci-templates/common/config-updater-meta.v1.yml
      - /gitlab-ci-templates/common/saltbert.v1.yml

stages:
  - lint
  - build
  - test
  - release
  - deploy

variables:
  IMAGE_SHA: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}
  # the Nextcloud the integration tests run against, see compose/nextcloud-test.Dockerfile
  NEXTCLOUD_TEST_IMAGE: ${CI_REGISTRY_IMAGE}/nextcloud-test:${CI_COMMIT_SHA}
  # Docker Hub repository, created by salt-automation:
  # terraform/services/dockerhub/registries/digsuv.yaml
  RELEASE_REGISTRY_IMAGE: magentaaps/msync
  POETRY_VERSION: "2.4.1"
  PRECOMMIT_USE_POETRY: "true"
  # create the poetry venv as .venv in the project directory so basedpyright's
  # venvPath/venv settings in pyproject.toml resolve in CI as well
  POETRY_VIRTUALENVS_IN_PROJECT: "true"


# Conditions
#############

.if-default-branch-refs: &if-default-branch-refs
  if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.if-tag: &if-tag
  if: '$CI_COMMIT_TAG'

.if-merge-request: &if-merge-request
  if: '$CI_MERGE_REQUEST_IID'


# Workflow
##########

workflow:
  rules:
    - <<: *if-tag
    - <<: *if-default-branch-refs
    - <<: *if-merge-request


# Linting
#########

lint:commits:
  extends: .lint:commits

# On merge requests: fail if any commit message lacks a [#<case number>]
# reference, like salt-automation's "Lint commits" job.
lint:case-number:
  stage: lint
  image: docker.io/library/alpine:3.22
  needs: []
  interruptible: true
  variables:
    GIT_DEPTH: 100
  script:
    - apk add git
    - git log $CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA --extended-regexp --invert-grep --exit-code --grep '\[#[0-9]+\]' || { echo "Commit(s) above are missing a [#<case number>] reference. Exiting."; exit 1; }
  rules:
    - <<: *if-merge-request

Pre-commit:
  image: python:3.14


# Build
#######

Build:
  extends: .build-docker

# The Nextcloud of compose.test.yaml with its setup script baked in, as GitLab
# services cannot mount files.
Build Nextcloud test:
  extends: .build-docker
  variables:
    CI_IMAGE: ${NEXTCLOUD_TEST_IMAGE}
    DOCKERFILE: ${CI_PROJECT_DIR}/compose/nextcloud-test.Dockerfile
  rules:
    - <<: *if-merge-request
    - <<: *if-default-branch-refs


# Test
######

# Run in the image Build pushed, which has the tests and the dev dependencies
# in /app, so there is no need for a checkout.
.test:
  stage: test
  image: ${IMAGE_SHA}
  interruptible: true
  variables:
    GIT_STRATEGY: none
  before_script:
    - cd /app
  rules:
    - <<: *if-merge-request
    - <<: *if-default-branch-refs

Unit tests:
  extends: .test
  needs: [Build]
  script:
    - pytest tests/unit

# The services of compose.yaml and compose.test.yaml. On the Kubernetes runner
# the services share the job's network namespace, so everything is on
# localhost, and Nextcloud's database listens on 5433 so it does not clash with
# ours.
# The tests against Microsoft Entra need the masked CI/CD variables
# MSYNC__MICROSOFT_CLOUD__TENANT_ID, MSYNC__MICROSOFT_CLOUD__CLIENT_ID and
# MSYNC__MICROSOFT_CLOUD__CLIENT_SECRET, with the test users of README.md.
Integration tests:
  extends: .test
  needs: [Build, Build Nextcloud test]
  # job variables are passed to the services as well, so the services' own
  # variables are set on each service
  variables:
    MSYNC__DIRECTORY_SERVICE: microsoft_cloud
    MSYNC__DATABASE_URL: postgresql+psycopg://msync:msync@localhost:5432/msync
    MSYNC__NEXTCLOUD__URL: http://localhost
    MSYNC__NEXTCLOUD__SERVICE_USER: msync
    MSYNC__NEXTCLOUD__SERVICE_PASSWORD: msync-service-password
    MSYNC__NEXTCLOUD__MANAGER_USER: msync-manager
    MSYNC__NEXTCLOUD__MANAGER_PASSWORD: msync-manager-password
    MSYNC__NEXTCLOUD__ALLOW_HTTP: "true"
    NEXTCLOUD_ADMIN_USER: admin
    NEXTCLOUD_ADMIN_PASSWORD: msync-admin-password
  services:
    - name: docker.io/library/postgres:18
      alias: postgres
      variables:
        POSTGRES_USER: msync
        POSTGRES_PASSWORD: msync
        POSTGRES_DB: msync
    - name: docker.io/library/postgres:18
      alias: nextcloud-postgres
      command: ["postgres", "-p", "5433"]
      variables:
        POSTGRES_USER: nextcloud
        POSTGRES_PASSWORD: nextcloud
        POSTGRES_DB: nextcloud
    - name: ${NEXTCLOUD_TEST_IMAGE}
      alias: nextcloud
      variables:
        POSTGRES_HOST: localhost:5433
        POSTGRES_DB: nextcloud
        POSTGRES_USER: nextcloud
        POSTGRES_PASSWORD: nextcloud
        NEXTCLOUD_ADMIN_USER: admin
        NEXTCLOUD_ADMIN_PASSWORD: msync-admin-password
        NEXTCLOUD_TRUSTED_DOMAINS: localhost nextcloud
        MSYNC_SERVICE_PASSWORD: msync-service-password
        MSYNC_MANAGER_PASSWORD: msync-manager-password
  script:
    # Nextcloud installs itself before it serves requests, which can take minutes
    - |
      for i in $(seq 120); do
        wget -qO- http://localhost/status.php 2>/dev/null | grep -q '"installed":true' && break
        echo "waiting for Nextcloud to finish installing ($i)"
        sleep 5
      done
    - wget -qO- http://localhost/status.php | grep -q '"installed":true' || { echo "Nextcloud did not finish installing. Exiting."; exit 1; }
    - pytest tests/integration


# Release
#########

# On master: run semantic-release, which creates a version tag (and GitLab
# release) from the conventional commits. The tag triggers a tag pipeline.
release:semantic-commit:
  extends: .release:semantic-commit

# On master: push the image to magentaaps/msync:master
Release master:
  extends: .release-master
  needs: [Build]

# On an X.Y.Z tag: push the image to magentaaps/msync with the semver tags
# computed by "Generate release tags" (X.Y.Z, X.Y, X, ...)
Release version:
  extends: .release-version
  needs: [Build, Generate release tags]


# Deploy
########

# On an X.Y.Z tag: bump MSYNC_APPLICATION_DOCKER_IMAGE in salt-automation's
# salt/pillar/digsuv/msync/magenta/staging.sls via the config updater.
# Needs the CONFIG_UPDATER_USERNAME and CONFIG_UPDATER_PASSWORD CI/CD variables.
Update staging version:
  extends: .release-to-dev
  needs: [Release version]
  variables:
    ENDPOINT: digsuv/salt/msync-update-staging

# On an X.Y.Z tag: after the config updater has bumped the image, call
# Saltbert2 on the digsuv saltmaster to run the digsuv.msync-staging
# orchestration (salt-automation: salt/orchestration/digsuv/msync-staging.sls),
# which highstates the msync staging server.
# Needs the SALTBERT_PASSWORD CI/CD variable, scoped to the staging environment.
Deploy staging:
  extends:
    - .rules:semver-core
    - .saltbert
  needs: [Update staging version]
  variables:
    SALTBERT_ORCHESTRATION: digsuv.msync-staging
    SALTBERT_URL: https://saltmaster.digsuv.magentahosted.dk
  environment:
    name: staging
    url: https://msync-staging.magentakommune.dk
