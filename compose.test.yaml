# test-only override, apply it with
# `docker compose -f compose.yaml -f compose.test.yaml ...`
# deliberately not named compose.override.yaml, as that would be merged
# automatically in production too

services:
  sync:
    depends_on:
      nextcloud:
        condition: service_healthy

  nextcloud:
    image: nextcloud:34.0.4-apache
    environment:
      POSTGRES_HOST: nextcloud-postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: msync-admin-password
      NEXTCLOUD_TRUSTED_DOMAINS: nextcloud localhost
      # the passwords of the accounts setup-nextcloud.sh creates
      MSYNC_SERVICE_PASSWORD: msync-service-password
      MSYNC_MANAGER_PASSWORD: msync-manager-password
    volumes:
      - nextcloud-data:/var/www/html
      # runs only on first install, so run `docker compose down -v` after changing it
      - ./compose/setup-nextcloud.sh:/docker-entrypoint-hooks.d/post-installation/setup-nextcloud.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/status.php | grep -q '\"installed\":true'"]
      interval: 5s
      timeout: 5s
      retries: 60
    depends_on:
      nextcloud-postgres:
        condition: service_healthy

  # a database server of its own, so nextcloud does not share one with the sync service
  nextcloud-postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
      POSTGRES_DB: nextcloud
    volumes:
      - nextcloud-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nextcloud-data:
  nextcloud-postgres-data:
