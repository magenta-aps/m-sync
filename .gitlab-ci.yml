include:
  - project: labs/salt-automation
    file:
      - /gitlab-ci-templates/common/rules.v1.yml
      - /gitlab-ci-templates/common/pre-commit.v1.yml
      - /gitlab-ci-templates/common/conventional-commits-meta.v1.yml

stages:
  - lint

variables:
  IMAGE_SHA: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}
  POETRY_VERSION: 1.3.2
  PRECOMMIT_USE_POETRY: "true"


# Conditions
#############

.if-default-branch-refs: &if-default-branch-refs
  if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.if-tag: &if-tag
  if: '$CI_COMMIT_TAG'

.if-merge-request: &if-merge-request
  if: '$CI_MERGE_REQUEST_IID'


# Workflow
##########

workflow:
  rules:
    - <<: *if-tag
    - <<: *if-default-branch-refs
    - <<: *if-merge-request


# Linting
#########

lint:commits:
  extends: .lint:commits

# # The pre-commit hooks for ruff and deptry use `language: system`, so their
# # executables must be installed. The template runs `poetry install`, but this
# # project has no root package, so it must run with --no-root.
# Pre-commit:
#   variables:
#     PRECOMMIT_USE_POETRY: "true"
#     POETRY_VERSION: "2.4.1"
