[tool.poetry]
name = "mSync"
version = "0.0.0"   # version managed through conventional commits
description = ""
authors = [
    "Magenta ApS <info@magenta.dk>"
]
license = "MPL-2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.13.5"
structlog = "^26.1.0"
pydantic-settings = "^2.15.0"
msgraph-sdk = "^1.63.0"
azure-identity = "^1.25.0"
typing-extensions = "^4.16.0"
starlette = "^1.7.0"
uvicorn = "^0.38.0"
sqlalchemy = { version = "^2.0.44", extras = ["asyncio"] }
psycopg = { version = "^3.2", extras = ["binary"] }

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
pytest-asyncio = "^1.4"
python-dotenv = "^1.2.3"
more-itertools = "^11.1.0"
httpx2 = "^2.0"

[tool.poetry.group.pre-commit.dependencies]
pre-commit = "^4.6"
ruff = "^0.16"
deptry = "^0.25"
basedpyright = "^1.31"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    # msgraph-sdk raises deprecation warnings on import of its generated
    # request builders, see https://github.com/microsoftgraph/msgraph-sdk-python/issues/965
    "ignore::DeprecationWarning:(msgraph|kiota_abstractions)\\..*",
]

[tool.deptry.package_module_name_map]
msgraph-sdk = "msgraph"
azure-identity = "azure"

[tool.deptry.per_rule_ignores]
# used as the database driver through SQLAlchemy's connection URL
DEP002 = ["psycopg"]

[tool.basedpyright]
# pin the import-resolution environment to the in-project poetry venv so the
# pre-commit hook works regardless of which interpreter launches basedpyright
venvPath = "."
venv = ".venv"
