include:
  - project: labs/salt-automation
    file:
      - /gitlab-ci-templates/common/rules.v1.yml
      - /gitlab-ci-templates/common/pre-commit.v1.yml
      - /gitlab-ci-templates/common/conventional-commits-meta.v1.yml

stages:
  - lint

variables:
  IMAGE_SHA: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}
  POETRY_VERSION: "2.4.1"
  PRECOMMIT_USE_POETRY: "true"
  # create the poetry venv as .venv in the project directory so basedpyright's
  # venvPath/venv settings in pyproject.toml resolve in CI as well
  POETRY_VIRTUALENVS_IN_PROJECT: "true"


# Conditions
#############

.if-default-branch-refs: &if-default-branch-refs
  if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.if-tag: &if-tag
  if: '$CI_COMMIT_TAG'

.if-merge-request: &if-merge-request
  if: '$CI_MERGE_REQUEST_IID'


# Workflow
##########

workflow:
  rules:
    - <<: *if-tag
    - <<: *if-default-branch-refs
    - <<: *if-merge-request


# Linting
#########

lint:commits:
  extends: .lint:commits

Pre-commit:
  image: python:3.14
